version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: feedback_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  data_generator:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://admin:password123@db:5432/feedback_db
    volumes:
      - .:/app

volumes:
  postgres_data:
